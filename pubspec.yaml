name: bacnet_plugin
description: >-
  High-throughput BACnet/IP client and server for Dart and Flutter, built on
  bacnet-stack via FFI with an isolate based, non-blocking engine.
version: 0.4.1
license: MIT
homepage: https://github.com/gencto/bacnet_plugin
repository: https://github.com/gencto/bacnet_plugin
issue_tracker: https://github.com/gencto/bacnet_plugin/issues

environment:
  sdk: ^3.11.0

dependencies:
  code_assets: ^2.1.0
  ffi: ^2.2.0
  hooks: ^2.2.0
  json_annotation: ^4.12.0
  logging: ^1.3.0
  meta: ^1.16.0
  native_toolchain_c: ^0.19.5

dev_dependencies:
  build_runner: ^2.16.1
  ffigen: ^22.0.0
  json_serializable: ^6.14.1
  lints: ^6.1.0
  mocktail: ^1.0.5
  test: ^1.30.0

platforms:
  android:
  ios:
  linux:
  macos:
  windows:

topics:
  - bacnet
  - bms
  - iot
  - ffi
  - protocol
