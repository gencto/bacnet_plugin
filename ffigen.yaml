# Regenerate with: dart run ffigen --config ffigen.yaml
# Only the engine API (native/src/bacnet_plugin.h) is exposed to Dart; the
# bacnet-stack internals stay private to the native library.
name: BacnetNative
description: Bindings for the bacnet_plugin native engine.
output: lib/src/native/bindings.g.dart
headers:
  entry-points:
    - native/src/bacnet_plugin.h
  include-directives:
    - native/src/bacnet_plugin.h
ffi-native:
  asset-id: package:bacnet_plugin/src/native/bindings.g.dart
functions:
  include:
    - bacnet_plugin_.*
  # Short, non-blocking calls. Calls that block (poll) or resolve host names
  # (init, bind_device, register_foreign_device) must not be leaf calls.
  leaf:
    include:
      - bacnet_plugin_version
      - bacnet_plugin_set_option
      - bacnet_plugin_wakeup
      - bacnet_plugin_events_data
      - bacnet_plugin_events_length
      - bacnet_plugin_events_clear
      - bacnet_plugin_stats
      - bacnet_plugin_send_confirmed
      - bacnet_plugin_send_unconfirmed
      - bacnet_plugin_send_network
      - bacnet_plugin_unbind_device
      - bacnet_plugin_device_binding
      - bacnet_plugin_local_address
      - bacnet_plugin_object_.*
      - bacnet_plugin_file_.*
      - bacnet_plugin_trend_log_.*
      - bacnet_plugin_backup_.*
      - bacnet_plugin_time_master_.*
      - bacnet_plugin_event_enrollment_.*
      - bacnet_plugin_audit_.*
structs:
  include:
    - bp_.*
macros:
  include:
    - BP_.*
comments:
  style: any
  length: full
preamble: |
  // ignore_for_file: type=lint, unused_import
