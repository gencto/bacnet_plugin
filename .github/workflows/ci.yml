name: CI/CD

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # bacnet-stack is cloned from github.com/bacnet-stack, which runners
      # sometimes fail to reach: retry instead of failing the job
      - name: Fetch bacnet-stack submodule
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          for attempt in 1 2 3 4; do
            git submodule update --init --depth 1 && exit 0
            echo "submodule fetch failed (attempt $attempt), retrying"
            sleep $((attempt * 15))
          done
          exit 1
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get --no-example
      - name: Verify generated code
        run: |
          dart run build_runner build --delete-conflicting-outputs
          dart run tool/generate_constants.dart
          python3 tool/gen_object_table.py
          git diff --exit-code -- lib native/src
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test hook benchmark tool
      - run: dart analyze --fatal-infos lib test hook benchmark tool
      - name: Compile native engine with warnings enabled
        run: |
          gcc -fsyntax-only -Wall -Wextra -Werror -Wno-unused-parameter \
            -DBACDL_BIP=1 -DPRINT_ENABLED=0 -DBACNET_STACK_STATIC_DEFINE \
            -Inative/bacnet-stack/src -Inative/src \
            native/src/*.c

  test:
    needs: analyze
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # bacnet-stack is cloned from github.com/bacnet-stack, which runners
      # sometimes fail to reach: retry instead of failing the job
      - name: Fetch bacnet-stack submodule
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          for attempt in 1 2 3 4; do
            git submodule update --init --depth 1 && exit 0
            echo "submodule fetch failed (attempt $attempt), retrying"
            sleep $((attempt * 15))
          done
          exit 1
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get --no-example
      - name: Unit tests
        run: dart test --exclude-tags integration
      - name: Client/server integration tests (loopback)
        if: runner.os != 'Windows'
        run: dart test --tags integration --reporter expanded

  flutter-example:
    needs: analyze
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build: linux
          - os: ubuntu-latest
            build: apk
          - os: macos-latest
            build: macos
          - os: macos-latest
            build: ios
          - os: windows-latest
            build: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: example
    steps:
      - uses: actions/checkout@v7
      # bacnet-stack is cloned from github.com/bacnet-stack, which runners
      # sometimes fail to reach: retry instead of failing the job
      - name: Fetch bacnet-stack submodule
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          for attempt in 1 2 3 4; do
            git submodule update --init --depth 1 && exit 0
            echo "submodule fetch failed (attempt $attempt), retrying"
            sleep $((attempt * 15))
          done
          exit 1
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Linux desktop dependencies
        if: matrix.build == 'linux'
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
            install -y ninja-build libgtk-3-dev
      - uses: actions/setup-java@v6
        if: matrix.build == 'apk'
        with:
          distribution: temurin
          java-version: "21"
      - run: flutter pub get
      - run: flutter analyze
      - name: Widget tests
        if: matrix.build == 'linux'
        run: flutter test test
      - name: Integration test (flutter-tester, native asset via build hook)
        if: matrix.build == 'linux'
        run: flutter test integration_test/app_test.dart -d flutter-tester
      - name: Build
        run: |
          case "${{ matrix.build }}" in
            ios) flutter build ios --simulator --debug ;;
            apk) flutter build apk --debug ;;
            *) flutter build ${{ matrix.build }} --release ;;
          esac
        shell: bash

  publish:
    needs: [test, flutter-example]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: pub.dev
    permissions:
      contents: read
      id-token: write # OIDC authentication with pub.dev
    steps:
      - uses: actions/checkout@v7
      # the package ships the pinned bacnet-stack sources;
      # bacnet-stack is cloned from github.com/bacnet-stack, which runners
      # sometimes fail to reach: retry instead of failing the job
      - name: Fetch bacnet-stack submodule
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          for attempt in 1 2 3 4; do
            git submodule update --init --depth 1 && exit 0
            echo "submodule fetch failed (attempt $attempt), retrying"
            sleep $((attempt * 15))
          done
          exit 1
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get --no-example
      - run: dart pub publish --force
