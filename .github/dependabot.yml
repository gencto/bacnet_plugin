version: 2
updates:
  - package-ecosystem: pub
    directories:
      - /
      - /example
    schedule:
      interval: weekly
    groups:
      pub:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  # bacnet-stack is pinned to a release: review updates (and regenerate
  # bp_object_table.h and the constants) before merging
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: monthly
