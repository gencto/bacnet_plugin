name: bacnet_plugin_example
description: Flutter demo of bacnet_plugin - BACnet/IP device discovery, property browsing, COV monitoring and a server with editable objects.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.11.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  # an application uses `bacnet_plugin: ^x.y.z`; the example uses the
  # package it is bundled with
  bacnet_plugin:
    path: ../
  go_router: ^18.0.2
  provider: ^6.1.5

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
